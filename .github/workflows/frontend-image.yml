# Tests and builds the frontend on GitHub's machines, so the VPS doesn't have to.
# On master the image is published to GitHub's registry as ghcr.io/<owner>/<repo>:sha-<commit>; Jenkins on the VPS
# waits for that tag and only pulls and runs it (Jenkinsfile, docs/deployment.md).
name: Frontend image

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  image:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Registry names must be lower case; the repository's owner isn't.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VITE_* values are baked into the bundle here. VITE_API_BASE_URL stays empty: the site calls the API on its own
      # address and the host Nginx forwards /api and /uploads to the backend.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          # Links the package to this (public) repository, which it takes its access settings from.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            VITE_API_BASE_URL=
            VITE_SWAGGER_URL=http://102.68.87.231:8090/swagger-ui/index.html
            VITE_PESAPAL_ENV=live
            VITE_GOOGLE_CLIENT_ID=353452894856-d9tudsttmmma590akjuetpap5na22vs9.apps.googleusercontent.com
            VITE_ENABLE_WHATSAPP_VERIFICATION=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
