# Host Nginx site with HTTPS: used once the Let's Encrypt certificate exists.
# Installed by deploy/nginx/install-host-site.sh as /etc/nginx/sites-available/ramellian on every deploy.
server {
    listen 80;
    server_name ramellianexecutivetravels.co.ke www.ramellianexecutivetravels.co.ke;
    return 301 https://ramellianexecutivetravels.co.ke$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ramellianexecutivetravels.co.ke www.ramellianexecutivetravels.co.ke;

    ssl_certificate     /etc/letsencrypt/live/ramellianexecutivetravels.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ramellianexecutivetravels.co.ke/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ramellian_ssl:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/ramellian-locations.conf;
}
