# Nginx inside the frontend container: serves the built single-page app.
# TLS, /api and /uploads are handled by the host Nginx (see deploy/nginx/host-site.conf).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints everything in /assets, so it can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or people keep loading an old release.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Every other path is a client-side route (e.g. /bookings/123).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
