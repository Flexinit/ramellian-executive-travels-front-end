# Routing shared by the http and https sites. Installed by deploy/nginx/install-host-site.sh as
# /etc/nginx/snippets/ramellian-locations.conf on every deploy; edit it here, not on the server.
#
#   /api/...      → backend (Spring Boot) on 127.0.0.1:8090
#   /uploads/...  → backend (photos and chat media)
#   everything    → the built site in /var/www/ramellian/current (put there by deploy/release.sh)
#
# The site calls the API on its own address, so these are same-site requests. The browser's Origin header is
# dropped before the backend sees it: the backend refuses any request carrying an origin it doesn't list.

root /var/www/ramellian/current;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# Vehicle photos, documents and handover pictures are uploaded through the API.
client_max_body_size 25m;

# Live "typing…" indicator is Server-Sent Events: must not be buffered.
location /api/v1/chat/typing/stream {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Origin "";
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

location /api/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Origin "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /uploads/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Origin "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Vite fingerprints everything in /assets, so it can be cached forever.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Pages must never be cached, or people keep loading an old release.
location = /index.html {
    add_header Cache-Control "no-cache";
}

# The build writes a real HTML page for each public page and each vehicle (vite-plugins/seo.js), for search engines
# and link previews. A vehicle added since the last build gets a neutral shell the app fills in.
location ^~ /vehicles/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /vehicle-shell.html;
}

# Every other path: its built page if it has one (/, /services, /faq…, sitemap.xml, robots.txt, llms.txt), else the
# bare app (app-shell.html, never indexed) — signed-in areas and booking steps are client-side routes.
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /app-shell.html;
}
