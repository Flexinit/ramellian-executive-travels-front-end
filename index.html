<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand-logo-1024-transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ramellian Executive Travels — Chauffeur &amp; Corporate Transport, Nairobi. Airport transfers, corporate hire, events, long-distance routes." />
    <meta name="theme-color" content="#F8F8F8" />
    <!-- Dark theme, applied before the page draws so a signed-in person who chose it never sees a white flash
         (src/lib/theme.js has the same key and rule): only when they chose dark AND a session is already here.
         Visitors are always light, and the device's own dark setting is ignored. -->
    <script>
      (function () {
        try {
          var signedIn = sessionStorage.getItem('auth:token') || localStorage.getItem('auth:token');
          if (signedIn && localStorage.getItem('ramellian.theme') === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts, from src/theme/fonts.js (filled in by vite.config.js) -->
    <!-- app-fonts -->

    <title>Ramellian Executive Travels</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
